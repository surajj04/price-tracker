<!-- track.html -->
{% extends "base.html" %}
{% block title %}Track a Product · Price Tracker{% endblock %}

{% block content %}
<div class="card">
    <h1>Track a New Product</h1>
    <p class="subtitle">Amazon ya Flipkart ka product URL paste karo aur check-frequency choose karo.</p>

    <form method="POST" action="{{ url_for('track') }}">
        <div class="field">
            <label for="product_url">Product URL</label>
            <input type="text" id="product_url" name="product_url"
                   placeholder="https://www.amazon.in/... or https://www.flipkart.com/..."
                   required autocomplete="off">
            <span class="hint">Paste the full product page URL from Amazon or Flipkart.</span>
        </div>

        <div class="field">
            <label for="frequency">Check price every</label>
            <select id="frequency" name="frequency">
                <option value="15min">Every 15 minutes</option>
                <option value="hourly" selected>Hourly</option>
                <option value="daily">Daily</option>
            </select>
        </div>

        <div class="btn-row">
            <button type="submit">Start Tracking</button>
        </div>
    </form>
</div>
{% endblock %}
